spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

jwt:
  secret: vethd_default_secret_key_at_least_256_bits_long_for_security_2026!
  expiration: 86400000

resend:
  api-key: test_api_key
  from: VetHD <test@vethd.com>

supabase:
  url: https://test.supabase.co
  key: test_key
  bucket: test-bucket
