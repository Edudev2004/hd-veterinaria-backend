server:
  port: ${PORT:8081}

spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

jwt:
  secret: ${JWT_SECRET:vethd_default_secret_key_at_least_256_bits_long_for_security_2026!}
  expiration: ${JWT_EXPIRATION:86400000}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:VetHD <onboarding@resend.dev>}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:vethd-bucket}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://hd-veterinaria-frontend.vercel.app}

